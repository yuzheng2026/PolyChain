name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: 'win64_msvc2022_64'
          modules: 'qtnetwork'

      - name: 安装 OpenSSL
        run: |
          choco install openssl -y

      - name: 配置 CMake 项目
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: 编译
        run: |
          cmake --build build --config Release

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: BlockchainSimulator-Windows
          path: build/Release/BlockchainSimulator.exe
